name: Desplegar · pruebas

on:
  workflow_dispatch:
    inputs:
      imagen_backend:
        description: Imagen del backend (ghcr.io/...:etiqueta)
        default: ghcr.io/fernandomartinez018/trayecta-go-backend:main
      imagen_keycloak:
        description: Imagen de Keycloak (ghcr.io/...:etiqueta)
        default: ghcr.io/fernandomartinez018/trayecta-go-keycloak:main
      aplicar_infra:
        description: Aplicar cambios de infraestructura (OpenTofu)
        type: boolean
        default: false

permissions:
  contents: read

# Un solo workflow a la vez toca el estado de OpenTofu y la VM.
concurrency:
  group: tofu-pruebas
  cancel-in-progress: false

jobs:
  infraestructura:
    if: ${{ inputs.aplicar_infra }}
    runs-on: ubuntu-24.04
    environment: pruebas   # requiere aprobación de Fernando
    defaults:
      run:
        working-directory: entornos/pruebas/tofu
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_tailscale_authkey: ${{ secrets.TS_AUTHKEY_VM }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.13.2
      - name: Init
        run: >
          tofu init -lockfile=readonly
          -backend-config="bucket=trayecta-go-tofu-estado"
          -backend-config="region=${{ vars.OCI_REGION }}"
          -backend-config="endpoints={s3=\"https://${{ vars.OCI_NAMESPACE }}.compat.objectstorage.${{ vars.OCI_REGION }}.oraclecloud.com\"}"
      - name: Aplicar
        run: tofu apply -auto-approve -no-color

  servicios:
    needs: [infraestructura]
    if: ${{ always() && (needs.infraestructura.result == 'success' || needs.infraestructura.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: pruebas   # requiere aprobación de Fernando
    steps:
      - uses: actions/checkout@v7
      - name: Unirse a Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:trayecta-pruebas
      - name: Instalar Ansible
        run: pipx install ansible-core==2.21.5
      - name: Desplegar con Ansible
        working-directory: entornos/pruebas/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          IMAGEN_BACKEND: ${{ inputs.imagen_backend }}
          IMAGEN_KEYCLOAK: ${{ inputs.imagen_keycloak }}
          DUCKDNS_SUBDOMINIO: ${{ vars.DUCKDNS_SUBDOMINIO }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          CORREO_CERTIFICADOS: ${{ vars.CORREO_CERTIFICADOS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
        run: ansible-playbook -i inventario.ini desplegar.yml
