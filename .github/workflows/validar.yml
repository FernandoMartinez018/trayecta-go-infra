name: Validar

# En todo PR, sin secretos ni acceso a la nube: OpenTofu, Ansible y Compose se validan con lo que está en el repositorio,
# y el script de arranque de Oracle (herramientas/oracle/) corre sus pruebas con una nube simulada.
on:
  pull_request:

permissions:
  contents: read

jobs:
  tofu:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: entornos/pruebas/tofu
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.13.2
      - name: Formato
        run: tofu fmt -check -recursive
      - name: Init sin backend (manda el lockfile versionado)
        run: tofu init -backend=false -input=false -lockfile=readonly
      - name: Validar
        run: tofu validate

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Incluye la comprobación de sintaxis del playbook.
      - uses: ansible/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # v26.10.1
        with:
          working_directory: entornos/pruebas/ansible

  compose:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: entornos/pruebas/compose
    steps:
      - uses: actions/checkout@v7
      - name: Compose de pruebas y del ensayo con los valores ficticios
        run: |
          docker compose -f compose.yaml --env-file ensayo.env config -q
          docker compose -f compose.yaml -f compose.ensayo.yaml --env-file ensayo.env config -q

  oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Bastan el Python 3.12 del runner y la biblioteca estándar: sin red, sin Docker y sin secretos. Si no descubre ninguna
      # prueba (por ejemplo, tras mover la carpeta) unittest sale con código 5 y el job falla en vez de pasar en vacío.
      - name: Pruebas del script de arranque de Oracle (nube simulada)
        run: python3 -I -m unittest discover -s herramientas/oracle -p test_bootstrap_oci.py
