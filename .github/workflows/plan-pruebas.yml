name: Plan · pruebas

on:
  pull_request:
    paths: ["entornos/pruebas/tofu/**", ".github/workflows/plan-pruebas.yml"]

permissions:
  contents: read
  pull-requests: write

# Un solo workflow a la vez toca el estado de OpenTofu (este y desplegar-pruebas comparten el grupo).
concurrency:
  group: tofu-pruebas
  cancel-in-progress: false

jobs:
  plan:
    # Mientras no exista la cuenta de Oracle configurada (variable OCI_REGION) el plan se omite; la validación corre en validar.yml.
    if: ${{ vars.OCI_REGION != '' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: entornos/pruebas/tofu
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_tailscale_authkey: ${{ secrets.TS_AUTHKEY_VM }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
      - name: Formato
        run: tofu fmt -check -recursive
      - name: Init
        run: >
          tofu init -lockfile=readonly
          -backend-config="bucket=trayecta-go-tofu-estado"
          -backend-config="region=${{ vars.OCI_REGION }}"
          -backend-config="endpoints={s3=\"https://${{ vars.OCI_NAMESPACE }}.compat.objectstorage.${{ vars.OCI_REGION }}.oraclecloud.com\"}"
      - name: Validar
        run: tofu validate
      - name: Plan
        run: tofu plan -no-color -lock=false
